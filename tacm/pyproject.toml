[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tacm"
version = "0.1.0"
description = "TAC-SM: Token–Algorithm–Coherence with Structure Memory — research-grade model for learning and transferring reusable computational structures"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
]

[project.scripts]
tacm-train    = "train:main"
tacm-evaluate = "evaluate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tacm*"]

[tool.setuptools.package-dir]
"" = "."
