# TAC-SM Stage 2 — 100M Parameters
# Goal: repository repair, transfer benchmark, MoE/Transformer comparison
# Target hardware: Kaggle A100 (40GB VRAM) or 2× T4

name: tacm-100m

transformer:
  vocab_size: 32000
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4          # GQA: 3 queries share 1 kv head
  ffn_dim: 3072
  max_seq_len: 4096
  dropout: 0.1
  rope_base: 10000.0
  norm_eps: 1.0e-5
  use_flash_attn: true
  gradient_checkpointing: true

concept_volume:
  n_concept_families: 16
  volume_dim: 96
  min_variance: 1.0e-4
  max_variance: 10.0
  lambda_consistency: 1.0
  lambda_separation: 0.5
  lambda_hierarchy: 0.3
  lambda_temporal: 0.2
  margin: 1.0

router:
  n_families: 8
  n_experts: 16
  top_k: 2
  lambda_entropy: 0.01
  lambda_load_balance: 0.01
  temperature: 1.0

expert:
  n_experts: 16
  expert_hidden_dim: 512
  shared_expert_dim: 512
  top_k: 2
  dropout: 0.1

memory:
  max_structures: 8192
  embedding_dim: 768
  retrieval_top_k: 8
  write_threshold: 0.6
  prune_threshold: 0.1
  decay_rate: 0.99
  similarity_metric: cosine

survival:
  w_retention: 0.25
  w_transfer: 0.25
  w_robustness: 0.25
  w_reuse: 0.25
  decay_steps: 1000
  prune_every: 500

verifier:
  hidden_dim: 384
  n_failure_classes: 8
  dropout: 0.1

multi_token:
  n_future_tokens: 8
  n_future_actions: 4
  action_vocab_size: 64
  w_next_token: 1.0
  w_multi_token: 0.5
  w_procedure: 0.3

training:
  batch_size: 4
  grad_accum_steps: 8         # effective batch = 32
  lr: 2.0e-4
  min_lr: 2.0e-5
  warmup_steps: 2000
  max_steps: 100000
  weight_decay: 0.1
  clip_grad_norm: 1.0
  dtype: bfloat16
  seed: 42
  eval_every: 1000
  save_every: 5000
  log_every: 100
  output_dir: ./checkpoints

  # Loss weights
  w_next_token: 1.0
  w_multi_token: 0.5
  w_volume: 0.2
  w_family_route: 0.3
  w_expert_route: 0.3
  w_structure_memory: 0.5
  w_transfer: 0.4
  w_survival: 0.2
  w_verifier: 0.5
