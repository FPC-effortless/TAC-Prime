# TAC-SM Stage 1 — 30M Parameters
# Goal: routing works, memory updates, toy repair tasks
# Target hardware: Kaggle T4 (16GB VRAM)

name: tacm-30m

transformer:
  vocab_size: 32000
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 2          # GQA: 4 queries share 1 kv head
  ffn_dim: 2048
  max_seq_len: 2048
  dropout: 0.1
  rope_base: 10000.0
  norm_eps: 1.0e-5
  use_flash_attn: true
  gradient_checkpointing: true

concept_volume:
  n_concept_families: 16
  volume_dim: 64
  min_variance: 1.0e-4
  max_variance: 10.0
  lambda_consistency: 1.0
  lambda_separation: 0.5
  lambda_hierarchy: 0.3
  lambda_temporal: 0.2
  margin: 1.0

router:
  n_families: 8
  n_experts: 8
  top_k: 2
  lambda_entropy: 0.01
  lambda_load_balance: 0.01
  temperature: 1.0

expert:
  n_experts: 8
  expert_hidden_dim: 256
  shared_expert_dim: 256
  top_k: 2
  dropout: 0.1

memory:
  max_structures: 2048
  embedding_dim: 512
  retrieval_top_k: 8
  write_threshold: 0.6
  prune_threshold: 0.1
  decay_rate: 0.99
  similarity_metric: cosine

survival:
  w_retention: 0.25
  w_transfer: 0.25
  w_robustness: 0.25
  w_reuse: 0.25
  decay_steps: 1000
  prune_every: 500

verifier:
  hidden_dim: 256
  n_failure_classes: 8
  dropout: 0.1

multi_token:
  n_future_tokens: 4
  n_future_actions: 2
  action_vocab_size: 64
  w_next_token: 1.0
  w_multi_token: 0.5
  w_procedure: 0.3

training:
  batch_size: 8
  grad_accum_steps: 4         # effective batch = 32
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 1000
  max_steps: 50000
  weight_decay: 0.1
  clip_grad_norm: 1.0
  dtype: bfloat16
  seed: 42
  eval_every: 500
  save_every: 2000
  log_every: 50
  output_dir: ./checkpoints

  # Loss weights
  w_next_token: 1.0
  w_multi_token: 0.5
  w_volume: 0.2
  w_family_route: 0.3
  w_expert_route: 0.3
  w_structure_memory: 0.5
  w_transfer: 0.4
  w_survival: 0.2
  w_verifier: 0.5
